<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>GraphRAG Lens</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" th:href="@{/css/instrument.css}" href="/css/instrument.css">
</head>
<body>
  <div class="app-frame">
    <header class="app-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1 class="brand-title">GraphRAG Lens</h1>
      </div>
      <div class="corpus-chip" id="corpus-chip" role="status" hidden></div>
    </header>
    <main class="canvas" aria-label="Knowledge Graph canvas">
      <div class="error-banner" id="error-banner" role="alert" hidden></div>
      <div class="canvas-idle">
        <p class="eyebrow">Knowledge Graph — Resting</p>
        <p class="subtitle">Watch a Knowledge Graph get built, clustered, and searched — the mechanics most GraphRAG tools keep hidden.</p>
        <div class="upload-control">
          <label class="upload-label" for="corpus-file-input">Upload a plain text (.txt) Corpus to get started</label>
          <input type="file" id="corpus-file-input" multiple accept=".txt">
        </div>
      </div>
    </main>
  </div>
  <script th:src="@{/js/upload.js}" src="/js/upload.js"></script>
</body>
</html>
