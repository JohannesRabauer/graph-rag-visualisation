services:
  neo4j:
    image: neo4j:2026.08.1-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-graphraglens}
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-graphraglens}", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s

  app:
    build: .
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY must be set}
    ports:
      - "8080:8080"
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j_data:
